.stage.crystal-active .crystal {
  clip-path:inset(0 28% 0 0);
}
.stage.crystal-active .ritual {
  clip-path:inset(0 0 0 72%);
}
.stage.ritual-active .crystal {
  clip-path:inset(0 72% 0 0);
}
.stage.ritual-active .ritual {
  clip-path:inset(0 0 0 28%);
}
.stage.crystal-active .crystal::before,
.stage.ritual-active .ritual::before {
  transform:scale(1.035);
  filter:saturate(1.05);
}
.center-mark {
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  text-align:center;
  color:var(--cream);
  mix-blend-mode:normal;
  transition:opacity .35s ease, transform .55s ease;
}
.brand {
  font-size:clamp(24px,3vw,42px);
  letter-spacing:.18em;
  text-transform:uppercase;
  white-space:nowrap;
}
.hint {
  margin-top:13px;
  font:400 10px/1.5 Arial,sans-serif;
  letter-spacing:.22em;
  text-transform:uppercase;
  opacity:.72;
}
.content {
  position:absolute;
  z-index:6;
  top:50%;
  width:50%;
  transform:translateY(-50%);
  color:var(--cream);
  pointer-events:none;
  transition:opacity .45s ease, transform .65s cubic-bezier(.22,.61,.36,1);
}
.content h2 {
  margin:0 0 12px;
  font-size:clamp(48px,7vw,100px);
  font-weight:400;
  line-height:.88;
  letter-spacing:-.035em;
}
.content p {
  margin:0;
  max-width:360px;
  font:300 12px/1.7 Arial,sans-serif;
  letter-spacing:.04em;
}
.crystal-content {
  left:0;
  padding-left:clamp(28px,7vw,110px);
  opacity:.45;
  transform:translate(-18px,-50%);
}
.ritual-content {
  right:0;
  padding-right:clamp(28px,7vw,110px);
  opacity:.45;
  transform:translate(18px,-50%);
  text-align:right;
}
.stage.crystal-active .crystal-content {
  opacity:1;
  transform:translate(0,-50%);
}
.stage.crystal-active .ritual-content {
  opacity:0;
  transform:translate(18px,-50%);
}
.stage.ritual-active .ritual-content {
  opacity:1;
  transform:translate(0,-50%);
}
.stage.ritual-active .crystal-content {
  opacity:0;
  transform:translate(-18px,-50%);
}
.stage.crystal-active .center-mark,
.stage.ritual-active .center-mark {
  opacity:0;
  transform:translate(-50%,-50%) scale(.94);
}
.credit {
  position:absolute;
  z-index:10;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  color:var(--cream);
  font:400 9px Arial,sans-serif;
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:.55;
  pointer-events:none;
}
@media (max-width:700px) {
  .content { width:72%; }
  .crystal-content { padding-left:24px; }
  .ritual-content { padding-right:24px; }
  .content h2 { font-size:48px; }
  .content p { font-size:11px; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="panel crystal" aria-hidden="true"></div>
  <div class="panel ritual" aria-hidden="true"></div>

  <div class="content crystal-content">
    <h2>Crystals</h2>
    <p>Objects chosen for their texture, presence and quiet ritual of touch.</p>
  </div>

  <div class="content ritual-content">
    <h2>Rituals</h2>
    <p>Small practices and meaningful objects for making space in the everyday.</p>
  </div>

  <div class="center-mark">
    <div class="brand">AstroVetro</div>
    
  </div>

  <div class="credit">Crystals&nbsp;&nbsp;&nbsp;&nbsp; Rituals</div>
</main>

<script>
const stage = document.getElementById('stage');

stage.addEventListener('mousemove', (event) => {
  const x = event.clientX / window.innerWidth;
  if (x < 0.5) {
    stage.classList.add('crystal-active');
    stage.classList.remove('ritual-active');
  } else {
    stage.classList.add('ritual-active');
    stage.classList.remove('crystal-active');
  }
});

stage.addEventListener('mouseleave', () => {
  stage.classList.remove('crystal-active', 'ritual-active');
});

// Clicking anywhere on the active side takes the visitor to the corresponding page.
stage.addEventListener('click', (event) => {
  if (event.clientX < window.innerWidth / 2) {
    window.location.href = 'astrovetro_final_website_combined_name.html#shop';
  } else {
    window.location.href = 'astrovetro_final_website_combined_name.html#rituals';
  }
});
</script>
</body>
</html>
