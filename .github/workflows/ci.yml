name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      DATABASE_URL: mongodb://localhost:27017/astrovetro_test
      JWT_SECRET: test-secret-key-at-least-32-characters-long-for-testing
      FRONTEND_URL: http://localhost:5173
      UPSTASH_REDIS_REST_URL: https://test.upstash.io
      UPSTASH_REDIS_REST_TOKEN: test-token
      DISABLE_RATE_LIMIT: 'true'
      RAZORPAY_KEY_ID: rzp_test_key_id
      RAZORPAY_KEY_SECRET: test_key_secret_12345
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret_12345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check src/db/connect.js
          node --check src/middleware/rateLimitStore.js
          node --check src/middleware/auth.js
          node --check src/payments/razorpay.js
          node --check src/controllers/orderController.js
          node --check src/services/inventoryService.js
          node --check src/config/env.js

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-port: 27017
          mongodb-db: astrovetro_test

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check for outdated dependencies
        run: npm outdated || true