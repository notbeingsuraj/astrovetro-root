<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17221d">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/favicon.svg">
<meta name="robots" content="noindex, follow">
<meta name="description" content="The pieces you have chosen so far.">
<title>Your Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="canonical" href="/cart.html">
<meta property="og:site_name" content="Astro Vetro">
<meta property="og:type" content="website">
<meta property="og:title" content="Your Bag — Astro Vetro">
<meta property="og:description" content="The pieces you have chosen so far.">
<meta property="og:url" content="/cart.html">
<meta property="og:image" content="/assets/img/og-card.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your Bag — Astro Vetro">
<meta name="twitter:description" content="The pieces you have chosen so far.">
<meta name="twitter:image" content="/assets/img/og-card.svg">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<header class="page-hero">
  <div class="wrap">
    <a class="back" href="/shop.html">← Continue shopping</a>
    <div class="eyebrow">Your selection</div>
    <h1>Your bag.</h1>
  </div>
</header>

<main id="main">
  <div class="page">
    <div class="wrap cart-grid">
      <div id="cartList"></div>
      <aside class="summary js-load" id="summary"></aside>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="/assets/api.js"></script>
<script src="/assets/store.js"></script>
<script>
AV.boot();
const FREE_ABOVE = AV.SHIPPING.freeAbove;
const SHIP = AV.SHIPPING.flat;
const listEl = AV.qs('#cartList');
const sumEl = AV.qs('#summary');

function render() {
  const cart = AV.getCart();
  if (!cart.length) {
    listEl.innerHTML = '<div class="empty">Your bag is empty — nothing is waiting.<br><a class="btn btn-light" href="/shop.html">Browse the collection</a></div>';
    sumEl.innerHTML = '';
    return;
  }
  /* Lines whose stock has dropped since they were added are trimmed here, so
     the shopper sees a real total rather than a price the API will refuse. */
  const atCap = (i) => Number.isFinite(i.stock) && i.stock > 0 && i.quantity >= i.stock;
  listEl.innerHTML = cart
    .map((i) => `
      <div class="cart-line">
        <a href="/product.html?slug=${encodeURIComponent(i.slug)}"><div class="art ${AV.art(cart.indexOf(i))}" role="img" aria-label="${AV.esc(i.name)}"></div></a>
        <div>
          <h3><a href="/product.html?slug=${encodeURIComponent(i.slug)}">${AV.esc(i.name)}</a></h3>
          <div class="price">${AV.formatPrice(i.price)}</div>
          <div class="stepper line-qty">
            <button type="button" data-qty-m="${i.slug}" aria-label="Decrease quantity of ${AV.esc(i.name)}">−</button>
            <span>${i.quantity}</span>
            <button type="button" data-qty-p="${i.slug}" aria-label="Increase quantity of ${AV.esc(i.name)}"${atCap(i) ? ' disabled title="That is all we have in stock"' : ''}>+</button>
          </div>
          ${atCap(i) ? '<p class="line-note">Only ' + i.stock + ' in stock.</p>' : ''}
          <button class="remove" data-remove="${i.slug}">Remove</button>
        </div>
        <span class="line-total">${AV.formatPrice(i.price * i.quantity)}</span>
      </div>`)
    .join('');

  const subtotal = AV.cartSubtotal();
  const shipping = subtotal >= FREE_ABOVE ? 0 : SHIP;
  const total = subtotal + shipping;
  sumEl.innerHTML = `
    <h3>Order summary</h3>
    <div class="row"><span>Subtotal</span><span>${AV.formatPrice(subtotal)}</span></div>
    <div class="row"><span>Shipping</span><span>${shipping ? AV.formatPrice(shipping) : 'Free'}</span></div>
    ${shipping ? `<div class="free-ship">Add ${AV.formatPrice(FREE_ABOVE - subtotal)} more for free shipping.</div>` : ''}
    <div class="row total"><span>Total</span><span>${AV.formatPrice(total)}</span></div>
    <a class="btn btn-light" href="/checkout.html">Checkout · ${AV.formatPrice(total)}</a>
    <p class="note" style="margin-top:14px">Shipping across India in 2–3 days. Free above ${AV.formatPrice(FREE_ABOVE)}.</p>`;
}

listEl.addEventListener('click', (e) => {
  const minus = e.target.closest('[data-qty-m]');
  const plus = e.target.closest('[data-qty-p]');
  const rm = e.target.closest('[data-remove]');
  if (minus) AV.setCartQty(minus.dataset.qtyM, (AV.getCart().find((i) => i.slug === minus.dataset.qtyM)?.quantity || 1) - 1);
  if (plus) AV.setCartQty(plus.dataset.qtyP, (AV.getCart().find((i) => i.slug === plus.dataset.qtyP)?.quantity || 1) + 1);
  if (rm) { AV.removeFromCart(rm.dataset.remove); AV.toast('Removed from your bag.', 'ok'); }
  render();
});

render();

/* Confirm the bag still matches live stock. A product that sold out since it
   was added is dropped with an explanation instead of failing at checkout. */
AV.api.get('/api/products?limit=100')
  .then((env) => {
    /* Only treat the bag as authoritative when the response really covered the
       catalogue; a truncated page must not delete lines it simply didn't list. */
    const all = !(env.meta && env.meta.hasMore);
    const dropped = AV.pruneCart(env.data || [], { all });
    if (dropped.length) {
      AV.toast(`No longer available: ${dropped.join(', ')}.`);
      render();
    }
  })
  .catch(() => { /* offline: keep showing the bag as it stands */ });
</script>
</body>
</html>
