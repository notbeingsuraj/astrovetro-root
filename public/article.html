<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal — Astro Vetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="siteHeader"></div>

<main>
  <div class="page">
    <div class="wrap article" id="articleRoot"></div>
  </div>
  <section class="section journal">
    <div class="wrap">
      <div class="section-title">
        <div><div class="eyebrow">Keep reading</div><h2>More from the journal</h2></div>
        <a class="btn btn-outline" href="/journal.html">View journal</a>
      </div>
      <div class="journal-grid" id="relatedArts"></div>
    </div>
  </section>
</main>

<footer id="siteFooter"></footer>

<script src="/assets/api.js"></script>
<script src="/assets/store.js"></script>
<script>
AV.boot();
const root = AV.qs('#articleRoot');
const related = AV.qs('#relatedArts');
const params = new URLSearchParams(location.search);
const slug = params.get('slug');

function prose(html) {
  const el = document.createElement('div');
  el.innerHTML = html;
  return `\n${el.textContent
    .split(/\n{2,}/)
    .map((p) => p.trim())
    .filter(Boolean)
    .map((p) => `<p>${escLine(p)}</p>`)
    .join('\n')}\n`;
}
function escLine(t) {
  return AV.esc(t)
    .replace(/(^|[\s(—-])(#+)\s/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^\s*[-*]\s+/gm, '• ');
}

(async () => {
  if (!slug) {
    root.innerHTML = '<div class="empty"><a class="btn btn-light" href="/journal.html">Open the journal</a></div>';
    return;
  }
  root.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const env = await AV.api.get(`/api/articles/${encodeURIComponent(slug)}`);
    const a = env.data;
    if (!a) throw new Error('Article not found');
    document.title = `${a.title} — Astro Vetro Journal`;

    root.innerHTML = `
      <a class="back" href="/journal.html">← Journal</a>
      <div class="eyebrow" style="margin-top:30px">${AV.esc(a.category || 'Journal')} · ${a.readingTime || ''} min read</div>
      <h1 style="font:400 clamp(40px,5vw,64px)/0.95 'Cormorant Garamond';text-transform:uppercase;letter-spacing:-.01em;margin:6px 0 18px">${AV.esc(a.title)}</h1>
      <p class="note">By ${AV.esc(a.author || 'AstroVetro')} · ${AV.formatDate(a.createdAt)}</p>
      <p class="lead">${AV.esc(a.excerpt || '')}</p>
      <div class="journal-img ${justice(a)}" role="img" aria-label="${AV.esc(a.title)}" style="height:420px;margin:34px 0;border-radius:18px"></div>
      <div class="prose">${prose(a.content || '')}</div>`;

    const tags = (a.tags || []).map((t) => `<span class="tag">${AV.esc(t)}</span>`).join(' ');
    if (tags) {
      root.insertAdjacentHTML('beforeend', `<div class="intention-chips" style="margin-top:34px">${tags}</div>`);
    }

    const pool = a.related || [];
    related.innerHTML = pool.length
      ? pool.filter((x) => x.slug !== a.slug).map((x, i) => AV.journalCard(x, i)).join('')
      : '<div class="empty">More stories arriving soon.</div>';
  } catch (e) {
    root.innerHTML = `<div class="empty">${AV.esc(AV.firstErr(e))}<br><a class="btn btn-ghost" href="/journal.html">Back to journal</a></div>`;
  }
})();

function justice(a) {
  const h = hash(a.slug || '');
  const list = ['j1', 'j2', 'j3'];
  return list[h % list.length];
}
function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
</script>
</body>
</html>
