<script>
/* ====================================================================
   ACCOUNT

   One page with several panels, and one page in the URL. The panel is in
   `?view=`, so a panel is linkable, survives a refresh, and the back button
   behaves. Nothing sensitive goes in the query string.

   Signed out, this is the sign-in and registration page. Signed in, it is the
   dashboard: GET /api/me supplies the whole overview in one request — identity,
   counts, default address, latest order — rather than the page firing one call
   per tile and rendering half of itself when one of them is slow.

   Panels are shown and hidden, not navigated to, so switching between them
   never loses a half-typed address form.
   ==================================================================== */

const C = AV.customer;
const root = AV.qs('#accountRoot');

/* `next` is where to go after signing in, and `safeNext` has already vetted it
   as a path on this site. */
const next = C.safeNext(C.readParam('next'), '/account.html');

const PANELS = [
  ['overview', 'Overview'],
  ['orders', 'Orders'],
  ['addresses', 'Addresses'],
  ['wishlist', 'Saved'],
  ['profile', 'Profile'],
  ['password', 'Password'],
];

let user = null;
let summaryData = null;

/* Two namespaces share this one `?view=`: the auth modes (login, register) and
   the signed-in panels. They are kept apart explicitly because they were not —
   `view` was validated against the panel list only, so /account.html?view=register
   silently fell through to 'overview' and rendered the sign-in form. Now an
   auth mode survives validation, and so does an unknown value (which falls back
   to overview rather than matching nothing). */
const AUTH_VIEWS = ['login', 'register'];
const requested = C.readParam('view');
let view = PANELS.some(([k]) => k === requested) ? requested : 'overview';
let authMode = AUTH_VIEWS.includes(requested) ? requested : 'login';

C.start('#accountRoot', async (el) => {
  if (await C.needsDatabase()) return C.databaseUnavailable(root);

  user = await AV.me();
  if (!user) return renderAuth();

  AV.setUser(user);
  AV.seo({
    title: 'Your account',
    description: 'Your orders, saved pieces, addresses and account details.',
    noindex: true,
  });

  await loadSummary();
});

/* ── Signed in ───────────────────────────────────────────────────────── */

/* The aggregate. One request for the whole overview; a dashboard that fires
   five calls to draw one screen can disagree with itself. */
async function loadSummary() {
  C.loading(root, 'Loading your account');
  try {
    summaryData = await AV.account.summary();
    user = summaryData.user || user;
    AV.setUser(user);
    renderShell();
  } catch (err) {
    C.clearBusy(root);
    C.error(root, err, { retry: loadSummary, level: 'h2', title: 'We could not load your account' });
  }
}

function renderShell() {
  AV.qs('#pageTitle').textContent = `${AV.givenName(user)}'s space.`;
  AV.qs('#pageSub').textContent = 'Your orders, saved pieces and details in one place.';

  const c = summaryData.counts || {};

  root.innerHTML = `
    <div class="acct-layout">
      <nav class="acct-nav" aria-label="Account sections">
        ${PANELS.map(([key, label]) => navLink(key, label, navCount(key, c))).join('\n        ')}
        <a href="/orders.html">All orders</a>
        ${user.role === 'admin' ? '<a href="/admin.html">Admin desk</a>' : ''}
        <a href="#" data-signout>Sign out</a>
      </nav>
      <div>
        ${pendingEmailNote()}
        <div id="acctPanel" class="acct-panel">${panelMarkup(view)}</div>
      </div>
    </div>`;

  wireShell();
  show(view);
}

function navLink(key, label, count) {
  const on = key === view;
  return `<a href="/account.html?view=${key}" data-panel="${key}"${on ? ' aria-current="page"' : ''}>
      <span>${AV.esc(label)}</span>${count === null ? '' : `<span class="n">${count}</span>`}
    </a>`;
}

/* Counts next to a destination, so a customer can see where their orders and
   saved pieces are without opening each panel. Zero is shown rather than
   hidden — a visible 0 is information, a missing number is not. */
function navCount(key, c) {
  if (key === 'orders') return c.orders ?? 0;
  if (key === 'wishlist') return c.wishlist ?? 0;
  if (key === 'addresses') return summaryData.addressCount ?? 0;
  return null;
}

/* An email change is held, not applied — see the note in accountController.
   Saying so here prevents the common confusion of "I changed my email and can I
   sign in with the new one yet?". */
function pendingEmailNote() {
  if (!summaryData.pendingEmail) return '';
  return `
    <div class="notice" role="status">
      We are confirming a change to <b>${AV.esc(summaryData.pendingEmail)}</b>.
      Your account still uses ${AV.esc(user.email)} until that is done.
    </div>`;
}

/* ── Panels ────────────────────────────────────────────────────────────
   Each returns its own markup, so the shell is written once and switching
   panels never rebuilds the navigation around them. */

function panelMarkup(key) {
  switch (key) {
    case 'overview': return overviewMarkup();
    case 'orders': return ordersMarkup();
    case 'addresses': return addressesMarkup();
    case 'wishlist': return wishlistMarkup();
    case 'profile': return profileMarkup();
    case 'password': return passwordMarkup();
    default: return '';
  }
}

function overviewMarkup() {
  const c = summaryData.counts || {};
  const latest = summaryData.latestOrder;
  const def = summaryData.defaultAddress;

  return `
    <div class="stat-grid">
      <a class="stat-card" href="/orders.html"><div class="n">${c.orders ?? 0}</div><div class="l">Orders</div></a>
      <div class="stat-card"><div class="n">${c.inTransit ?? 0}</div><div class="l">On the way</div></div>
      <a class="stat-card" href="/wishlist.html"><div class="n">${c.wishlist ?? 0}</div><div class="l">Saved</div></a>
      <a class="stat-card" href="/cart.html"><div class="n">${c.bag ?? 0}</div><div class="l">In your bag</div></a>
    </div>

    ${latest
      ? `<div class="order-card">
          <div class="order-card-head">
            <div>
              <div class="meta" style="margin-bottom:6px">Your most recent order</div>
              <a class="num order-row-link" href="/orders/${encodeURIComponent(latest.orderNumber)}">${AV.esc(latest.orderNumber)}</a>
              <div class="meta">
                <span>${AV.formatDate(latest.createdAt)}</span>
                <span>${AV.esc(C.pieces(latest.itemCount))}</span>
                <span>${C.money(latest.total)}</span>
              </div>
            </div>
            ${C.statusBadge(latest.status)}
          </div>
          <div class="order-card-actions">
            <a class="btn btn-outline btn-sm" href="/orders/${encodeURIComponent(latest.orderNumber)}">View order</a>
            ${latest.trackable
              ? `<a class="btn btn-light btn-sm" href="/tracking/${encodeURIComponent(latest.orderNumber)}">Track parcel</a>`
              : ''}
          </div>
        </div>`
      : `<div class="av-state">
          <h2>No orders yet</h2>
          <p>When you place an order it will appear here, along with everything you have saved.</p>
          <a class="btn btn-light" href="/shop.html">Browse the collection</a>
        </div>`}

    <div class="order-card" style="margin-top:24px">
      <div class="meta" style="margin-bottom:6px">Delivers to</div>
      ${def
        ? `<div class="who" style="font:400 22px var(--font-display)">${AV.esc(def.name)}</div>
           <address style="font-style:normal;color:var(--text-secondary);font-size:13px;line-height:1.8;margin-top:4px">${C.addressText(def)}</address>`
        : `<p class="note" style="margin:6px 0 14px">You have not saved a delivery address yet. You can add one at checkout, or here.</p>`}
      <div class="order-card-actions">
        <a class="btn btn-outline btn-sm" href="/account.html?view=addresses">Manage addresses</a>
      </div>
    </div>

    <div class="notice" style="margin-top:24px">
      Welcome back, ${AV.esc(AV.givenName(user))}. Next time you are here, we will have
      your addresses ready and your saved pieces waiting.
    </div>`;
}

function ordersMarkup() {
  return `
    <h2 style="font:400 var(--text-h2) var(--font-display);margin-bottom:6px">Your orders</h2>
    <p class="note" style="margin-bottom:18px">
      Every order you have placed, newest first. Full details are on the order's own page.
    </p>
    <div id="ordersHost"></div>
    <div class="order-card-actions" style="margin-top:20px">
      <a class="btn btn-outline btn-sm" href="/orders.html">Open order history</a>
    </div>`;
}

function addressesMarkup() {
  return `
    <h2 style="font:400 var(--text-h2) var(--font-display);margin-bottom:6px">Saved addresses</h2>
    <p class="note" style="margin-bottom:18px">
      Used at checkout. Editing one never changes an order that has already been placed.
    </p>
    <div id="addrHost"></div>
    <button class="btn btn-outline" type="button" id="addAddrBtn" style="margin-top:18px">+ Add an address</button>
    <div id="addrFormWrap" hidden>${addressFormMarkup()}</div>`;
}

function wishlistMarkup() {
  const c = summaryData.counts || {};
  return `
    <h2 style="font:400 var(--text-h2) var(--font-display);margin-bottom:6px">Saved pieces</h2>
    <p class="note" style="margin-bottom:18px">
      ${c.wishlist
        ? `You have ${AV.esc(C.pieces(c.wishlist))} set aside.`
        : 'Nothing set aside yet.'}
    </p>
    <div class="order-card-actions">
      <a class="btn btn-outline btn-sm" href="/wishlist.html">Open your wishlist</a>
      <a class="btn btn-light btn-sm" href="/shop.html">Find something to save</a>
    </div>`;
}

function profileMarkup() {
  return `
    <h2 style="font:400 var(--text-h2) var(--font-display);margin-bottom:6px">Your details</h2>
    <p class="note" style="margin-bottom:18px">
      Your email is the address we send order confirmations to, so changing it
      takes a confirmation step.
    </p>
    <form class="form-narrow" id="profileForm" novalidate>
      <p class="form-msg"></p>
      <label>Full name<input name="name" required autocomplete="name" value="${AV.esc(user.name || '')}"></label>
      <label>Phone<input name="phone" autocomplete="tel" inputmode="tel" value="${AV.esc(user.phone || '')}"
        placeholder="+91 …"></label>
      <label>Email<input type="email" name="email" autocomplete="email" value="${AV.esc(user.email || '')}"
        placeholder="a new address to switch to"></label>
      <p class="hint" style="margin:0">
        We keep your current address working until you confirm a change, so nobody
        can take over your account by changing the email on a live session.
      </p>
      <button class="btn btn-light" type="submit">Save changes</button>
    </form>`;
}

function passwordMarkup() {
  return `
    <h2 style="font:400 var(--text-h2) var(--font-display);margin-bottom:6px">Your password</h2>
    <p class="note" style="margin-bottom:18px">
      Changing your password signs you out everywhere, including this browser.
    </p>
    <form class="form-narrow" id="pwForm" novalidate>
      <p class="form-msg"></p>
      <label>Current password<input type="password" name="currentPassword" required autocomplete="current-password"></label>
      <label>New password<input type="password" name="newPassword" required minlength="8" autocomplete="new-password">
        <small class="hint">At least 8 characters.</small></label>
      <button class="btn btn-light" type="submit">Change password</button>
    </form>`;
}

/* ── Shell events ───────────────────────────────────────────────────── */

function wireShell() {
  root.querySelectorAll('[data-panel]').forEach((a) =>
    a.addEventListener('click', (e) => {
      e.preventDefault();
      go(a.dataset.panel);
    })
  );

  root.querySelector('[data-signout]')?.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await AV.auth.logout();
    } catch (_err) {
      /* Even if the server call fails, the local session is being dropped —
         the next request will fail too and the pages handle that. */
    }
    AV.clearCommerceCache();
    AV.toast('You are signed out.', 'ok');
    location.href = '/account.html';
  });

}

/* Opening a blank address form. Reuses the same form and the same submit path
   as editing, with no id — so an accidental save cannot overwrite an existing
   address. */
function wireAddressAdd() {
  AV.qs('#addAddrBtn')?.addEventListener('click', () => {
    const wrap = AV.qs('#addrFormWrap');
    if (!wrap) return;
    wrap.innerHTML = addressFormMarkup();
    wrap.removeAttribute('hidden');
    wireAddressForm(AV.qs('#addrForm'), async (payload) => {
      await AV.addresses.create(payload);
      AV.toast('Address saved.', 'ok');
      wrap.setAttribute('hidden', '');
      await loadAddresses();
    });
    wrap.querySelector('input')?.focus();
  });
}

/* The single owner of the panel's contents. Panel-specific loading and wiring
   live here only; a second copy in wireShell() made the first render fetch
   addresses and orders twice and bind two listeners per control. The outgoing
   element is swapped out after its replacement is built, because removing it
   first and then searching for it by id finds nothing. */
function show(key) {
  const outgoing = root.querySelector('.acct-panel');

  const host = document.createElement('div');
  host.className = 'acct-panel';
  host.id = 'acctPanel';
  host.innerHTML = panelMarkup(key);
  outgoing?.replaceWith(host);
  if (!outgoing) AV.qs('#acctPanel')?.after(host);

  root.querySelectorAll('[data-panel]').forEach((a) => {
    const on = a.dataset.panel === key;
    if (on) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  view = key;
  wireAddressAdd();
  if (key === 'profile') wireProfile();
  if (key === 'password') wirePassword();
  if (key === 'addresses') loadAddresses();
  if (key === 'orders') loadOrders();
}

function go(key) {
  C.setParams({ view: key });
  show(key);
  /* Focus the panel heading so keyboard and screen-reader users land inside the
     new content rather than back at the navigation. */
  const h = root.querySelector('.acct-panel h2');
  if (h) {
    h.setAttribute('tabindex', '-1');
    h.focus({ preventScroll: true });
  }
}

/* ── Profile ────────────────────────────────────────────────────────── */

function wireProfile() {
  const form = AV.qs('#profileForm');
  if (!form) return;

  C.onSubmit(form, async (body) => {
    const patch = { name: body.name, phone: body.phone || '' };
    /* Only sent when it actually differs. Sending the same address back would
       make the server treat an unchanged field as a change request. */
    if (body.email && body.email.trim().toLowerCase() !== user.email.toLowerCase()) {
      patch.email = body.email.trim();
    }

    const updated = await AV.account.updateProfile(patch);
    AV.setUser(updated);
    /* Re-read rather than assuming: the response says whether the email change
       was applied or held for confirmation, and the panel has to reflect that
       distinction. */
    await loadSummary();
    C.say(AV.qs('#profileForm .form-msg'), 'Saved.', true);
  });
}

/* ── Password ───────────────────────────────────────────────────────── */

function wirePassword() {
  const form = AV.qs('#pwForm');
  if (!form) return;

  C.onSubmit(form, async (body) => {
    await AV.account.changePassword(body.currentPassword, body.newPassword);
    /* The server invalidates every existing token on a password change, so this
       session is already dead. Clearing it locally and returning to sign-in is
       the honest state, not a failure to handle. */
    AV.setUser(null);
    AV.clearCommerceCache();
    C.say(AV.qs('#pwForm .form-msg'), 'Your password has been changed. Please sign in again.', true);
    setTimeout(() => {
      location.href = '/account.html?view=login';
    }, 1800);
  });
}

/* ── Addresses ──────────────────────────────────────────────────────── */

async function loadAddresses() {
  const host = AV.qs('#addrHost');
  if (!host) return;
  C.loading(host, 'Loading your addresses');
  try {
    const data = await AV.addresses.list();
    renderAddresses(host, data.addresses || []);
    /* The nav badge counts addresses too, so it is refreshed from the same
       response rather than left showing a number that has changed. */
    summaryData.addressCount = data.count;
    const nav = root.querySelector('[data-panel="addresses"] .n');
    if (nav) nav.textContent = data.count;
  } catch (err) {
    C.clearBusy(host);
    C.error(host, err, { retry: loadAddresses, title: 'We could not load your addresses' });
  }
}

function renderAddresses(host, list) {
  C.clearBusy(host);

  if (!list.length) {
    host.innerHTML = '<div class="av-state"><h2>No addresses yet</h2><p>Add one now and checkout will be quicker next time.</p></div>';
    return;
  }

  host.innerHTML = `<div class="addr-grid">${list.map(addrCardHTML).join('\n')}</div>`;
  host.querySelectorAll('[data-edit]').forEach((b) =>
    b.addEventListener('click', () => editAddress(b.dataset.edit, list))
  );
  host.querySelectorAll('[data-default]').forEach((b) =>
    b.addEventListener('click', () => makeDefault(b.dataset.default))
  );
  host.querySelectorAll('[data-del]').forEach((b) =>
    b.addEventListener('click', () => deleteAddress(b.dataset.del))
  );
}

function addrCardHTML(a) {
  return `
    <div class="addr-card${a.isDefault ? ' is-default' : ''}" data-addr="${AV.esc(a.id)}">
      <div class="label">
        <span>${AV.esc(a.label || 'Address')}</span>
        ${a.isDefault ? '<span class="tag">Default</span>' : ''}
      </div>
      <div class="who">${AV.esc(a.name)}</div>
      <address>${C.addressText(a)}</address>
      <div class="qt" style="color:var(--text-muted);font-size:12px">${AV.esc(a.phone)}</div>
      <div class="addr-actions">
        <button class="btn btn-outline btn-sm" type="button" data-edit="${AV.esc(a.id)}">Edit</button>
        ${a.isDefault ? '' : `<button class="btn btn-ghost btn-sm" type="button" data-default="${AV.esc(a.id)}">Make default</button>`}
        <button class="btn btn-ghost btn-sm" type="button" data-del="${AV.esc(a.id)}">Remove</button>
      </div>
    </div>`;
}

function addressFormMarkup(a = {}) {
  return `
    <form class="form-narrow" id="addrForm" novalidate style="margin-top:24px;padding-top:24px;border-top:1px solid var(--border-subtle)">
      <p class="form-msg"></p>
      <div class="form-row-2">
        <label>Label<input name="label" placeholder="Home, Work…" value="${AV.esc(a.label || '')}"></label>
        <label>Full name<input name="name" required autocomplete="name" value="${AV.esc(a.name || user.name || '')}"></label>
      </div>
      <label>Phone<input name="phone" required autocomplete="tel" inputmode="tel" value="${AV.esc(a.phone || user.phone || '')}"></label>
      <label>Address line 1<input name="line1" required autocomplete="address-line1" value="${AV.esc(a.line1 || '')}"></label>
      <label>Address line 2 <span style="color:var(--text-muted);text-transform:none;letter-spacing:0">(optional)</span>
        <input name="line2" autocomplete="address-line2" value="${AV.esc(a.line2 || '')}"></label>
      <div class="form-row-2">
        <label>City<input name="city" required autocomplete="address-level2" value="${AV.esc(a.city || '')}"></label>
        <label>State<input name="state" required autocomplete="address-level1" value="${AV.esc(a.state || '')}"></label>
      </div>
      <div class="form-row-2">
        <label>PIN code<input name="pincode" required autocomplete="postal-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" value="${AV.esc(a.pincode || '')}"></label>
        <label>Country<input name="country" required autocomplete="country-name" value="${AV.esc(a.country || 'India')}"></label>
      </div>
      <div class="line-actions">
        <button class="btn btn-light" type="submit" id="addrSave">Save address</button>
        <button class="btn btn-ghost" type="button" id="addrCancel">Cancel</button>
      </div>
    </form>`;
}

function wireAddressForm(form, onDone) {
  C.onSubmit(form, async (body) => {
    const payload = {
      label: body.label || 'Home',
      name: body.name,
      phone: body.phone,
      line1: body.line1,
      line2: body.line2 || '',
      city: body.city,
      state: body.state,
      pincode: body.pincode,
      country: body.country,
    };
    await onDone(payload);
  });
  form.querySelector('#addrCancel')?.addEventListener('click', () => {
    form.closest('#addrFormWrap')?.setAttribute('hidden', '');
  });
}

function editAddress(id, list) {
  const a = list.find((x) => x.id === id);
  if (!a) return;
  const wrap = AV.qs('#addrFormWrap');
  wrap.innerHTML = addressFormMarkup(a);
  wrap.removeAttribute('hidden');
  wireAddressForm(AV.qs('#addrForm'), async (payload) => {
    await AV.addresses.update(id, payload);
    AV.toast('Address updated.', 'ok');
    wrap.setAttribute('hidden', '');
    await loadAddresses();
  });
  wrap.querySelector('input')?.focus();
}

/* Setting a default re-renders from the response. The server clears the old
   default in the same operation, so the page never has to flip two cards
   locally and risk showing a default the database did not accept. */
async function makeDefault(id) {
  try {
    await AV.addresses.setDefault(id);
    AV.toast('Default address updated.', 'ok');
    await loadAddresses();
  } catch (err) {
    AV.toast(AV.firstErr(err), 'err');
  }
}

async function deleteAddress(id) {
  if (!window.confirm('Remove this address? Orders already placed keep it.')) return;
  try {
    await AV.addresses.remove(id);
    AV.toast('Address removed.', 'ok');
    await loadAddresses();
  } catch (err) {
    AV.toast(AV.firstErr(err), 'err');
  }
}

/* ── Orders panel ───────────────────────────────────────────────────── */

async function loadOrders() {
  const host = AV.qs('#ordersHost');
  if (!host) return;
  C.loading(host, 'Loading your orders');
  try {
    const data = await AV.orders.list({ page: 1, limit: 5 });
    const orders = data.orders || [];
    C.clearBusy(host);
    host.innerHTML = orders.length
      ? `<div class="order-list">${orders.map(orderRowHTML).join('\n')}</div>`
      : '<div class="av-state"><h3>No orders yet</h3><p>Your orders will appear here once you place one.</p></div>';
  } catch (err) {
    C.clearBusy(host);
    C.error(host, err, { retry: loadOrders, title: 'We could not load your orders' });
  }
}

/* A compact row, not the full history page: the panel is a summary, and the
   link to /orders.html is the way to see everything. */
function orderRowHTML(o) {
  const itemCount = (o.items || []).reduce((n, i) => n + i.quantity, 0);
  return `
    <div class="order-card">
      <div class="order-card-head">
        <div>
          <a class="num order-row-link" href="/orders/${encodeURIComponent(o.orderNumber)}">${AV.esc(o.orderNumber)}</a>
          <div class="meta">
            <span>${AV.formatDate(o.createdAt)}</span>
            <span>${AV.esc(C.pieces(itemCount))}</span>
            <span>${C.money(o.total)}</span>
          </div>
        </div>
        ${C.statusBadge(o.status)}
      </div>
    </div>`;
}

/* ── Signed out: sign in or create an account ───────────────────────── */

function renderAuth() {
  const mode = authMode;
  AV.seo({
    title: mode === 'register' ? 'Create an account' : 'Sign in',
    description: mode === 'register'
      ? 'Create an account for saved pieces, addresses and order history.'
      : 'Sign in to see your orders, saved pieces and addresses.',
    noindex: true,
  });

  AV.qs('#pageTitle').textContent = mode === 'register' ? 'Join us.' : 'Welcome back.';
  AV.qs('#pageSub').textContent = mode === 'register'
    ? 'An account keeps your saved pieces, addresses and orders together.'
    : 'Sign in to see your orders, saved pieces and addresses.';

  root.innerHTML = `
    <div style="max-width:480px;margin:0 auto">
      <div class="tabs" role="tablist">
        <button class="tab${mode === 'login' ? ' active' : ''}" role="tab" aria-selected="${mode === 'login'}" data-mode="login">Sign in</button>
        <button class="tab${mode === 'register' ? ' active' : ''}" role="tab" aria-selected="${mode === 'register'}" data-mode="register">Create account</button>
      </div>
      <form id="authForm" novalidate>
        <p class="form-msg"></p>
        ${mode === 'register' ? '<label>Full name<input name="name" required autocomplete="name" autofocus></label>' : ''}
        <label>Email<input type="email" name="email" required autocomplete="email"${mode === 'login' ? ' autofocus' : ''}></label>
        ${mode === 'register' ? '<label>Phone <span style="color:var(--text-muted);text-transform:none;letter-spacing:0">(optional)</span><input name="phone" autocomplete="tel" inputmode="tel" placeholder="+91 …"></label>' : ''}
        <label>Password<input type="password" name="password" required autocomplete="${mode === 'register' ? 'new-password' : 'current-password'}"${mode === 'register' ? ' minlength="8"' : ''}></label>
        ${mode === 'register' ? '<small class="hint" style="margin:0 0 18px">At least 8 characters.</small>' : ''}
        <button class="btn btn-light btn-block" type="submit">${mode === 'register' ? 'Create account' : 'Sign in'}</button>
      </form>
      <p class="note" style="margin-top:22px">
        ${mode === 'register'
          ? 'Already have an account? <a href="/account.html?view=login">Sign in instead</a>.'
          : 'New here? <a href="/account.html?view=register">Create an account</a>.'}
        &middot; <a href="/shop.html">Keep browsing</a>
      </p>
    </div>`;

  root.querySelectorAll('[data-mode]').forEach((b) =>
    b.addEventListener('click', () => {
      C.setParams({ view: b.dataset.mode });
      /* The mode is the navigation state here, so it is read back from the URL
         rather than mutated in place — that keeps renderAuth() a pure function
         of the URL and stops the two copies of the mode drifting apart. */
      const url = new URL(location.href);
      authMode = AUTH_VIEWS.includes(url.searchParams.get('view')) ? url.searchParams.get('view') : 'login';
      renderAuth();
    })
  );

  C.onSubmit(AV.qs('#authForm'), async (body) => {
    if (mode === 'register') {
      await AV.auth.register(body.name, body.email, body.password, body.phone);
    } else {
      await AV.auth.login(body.email, body.password);
    }
    /* The guest bag is folded into the new account's bag before leaving, so
       anything chosen before signing up is not silently dropped. */
    await C.afterSignIn();
    AV.toast(mode === 'register' ? 'Welcome to Astro Vetro.' : 'Welcome back.', 'ok');
    /* replaceState first so the back button does not return to a form that has
       already succeeded. */
    history.replaceState(null, '', next);
    location.href = next;
  });
}
</script>
