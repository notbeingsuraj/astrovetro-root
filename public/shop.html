<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17221d">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/favicon.svg">
<meta name="robots" content="index, follow">
<meta name="description" content="Browse the full collection: crystal towers, jewellery, points and clusters, chosen in small batches and packed by hand.">
<title>Shop Crystals &amp; Ritual Objects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="canonical" href="/shop.html">
<meta property="og:site_name" content="Astro Vetro">
<meta property="og:type" content="website">
<meta property="og:title" content="Shop Crystals &amp; Ritual Objects — Astro Vetro">
<meta property="og:description" content="Browse the full collection: crystal towers, jewellery, points and clusters, chosen in small batches and packed by hand.">
<meta property="og:url" content="/shop.html">
<meta property="og:image" content="/assets/img/og-card.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shop Crystals &amp; Ritual Objects — Astro Vetro">
<meta name="twitter:description" content="Browse the full collection: crystal towers, jewellery, points and clusters, chosen in small batches and packed by hand.">
<meta name="twitter:image" content="/assets/img/og-card.svg">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<header class="page-hero">
  <div class="wrap">
    <a class="back" href="/home.html">← Home</a>
    <div class="eyebrow">The collection</div>
    <h1>Shop by intention.</h1>
    <p class="sub" id="shopSub">Crystals, bracelets and ritual objects chosen for the way they make a space feel.</p>
    <div class="toolbar" style="margin-top:40px">
      <div class="filters">
        <form class="search-field" id="searchForm">
          <input type="search" id="searchInput" placeholder="Search the collection">
          <button class="btn btn-ghost btn-sm" type="submit">Search</button>
        </form>
        <select id="catSelect" aria-label="Category">
          <option value="">All categories</option>
        </select>
        <select id="sortSelect" aria-label="Sort">
          <option value="createdAt:desc">Newest</option>
          <option value="price:asc">Price · low to high</option>
          <option value="price:desc">Price · high to low</option>
          <option value="rating:desc">Top rated</option>
          <option value="name:asc">Name</option>
        </select>
      </div>
      <span class="meta-count" id="resultCount"></span>
    </div>
    <div class="intention-chips" id="intentionChips"></div>
  </div>
</header>

<main id="main">
  <div class="page">
    <div class="wrap">

      <!-- Shown only before any filter narrows the list. -->
      <section class="featured-rail" id="featuredRail" hidden>
        <div class="featured-head">
          <div>
            <div class="kicker">Most chosen</div>
            <h2>Where to begin.</h2>
          </div>
          <a class="btn btn-ghost btn-sm" href="/shop.html">See everything</a>
        </div>
        <div class="products-grid" id="featuredGrid"></div>
      </section>

      <div class="products-grid js-load" id="shopGrid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="/assets/api.js"></script>
<script src="/assets/store.js"></script>
<script>
AV.boot();

const grid = AV.qs('#shopGrid');
const pagerEl = AV.qs('#pager');
const countEl = AV.qs('#resultCount');

const params = new URLSearchParams(location.search);
let page = Math.max(1, Number(params.get('page') || 1));

function state() {
  return {
    search: params.get('search') || '',
    intention: params.get('intention') || '',
    category: params.get('category') || '',
    sort: params.get('sort') || 'createdAt',
    order: params.get('order') || 'desc',
  };
}
function syncUrl() {
  const s = state();
  for (const k of ['search', 'intention', 'category', 'sort', 'order']) {
    if (s[k]) params.set(k, s[k]);
    else params.delete(k);
  }
  params.set('page', String(page));
  history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
}

/* Tracks an in-flight load so a slow response cannot overwrite a newer one. */
let loadToken = 0;

function isFiltered() {
  const s = state();
  return Boolean(s.search || s.intention || s.category);
}

/* Featured rail only when the visitor has not narrowed anything yet. */
async function loadFeatured() {
  const rail = AV.qs('#featuredRail');
  const fgrid = AV.qs('#featuredGrid');
  if (isFiltered()) { rail.hidden = true; return; }
  try {
    let env = await AV.api.get('/api/products?limit=4&featured=true');
    let items = env.data || [];
    if (!items.length) {
      env = await AV.api.get('/api/products?limit=4&sort=rating&order=desc');
      items = env.data || [];
    }
    if (!items.length) { rail.hidden = true; return; }
    fgrid.innerHTML = items.map((p, i) => AV.productCard(p, i)).join('');
    rail.hidden = false;
  } catch (_e) {
    rail.hidden = true; // rail is a bonus, never a blocker
  }
}

async function load() {
  const token = ++loadToken;
  const s = state();
  const q = new URLSearchParams({
    page: String(page),
    limit: '12',
    sort: s.sort,
    order: s.order,
  });
  if (s.search) q.set('search', s.search);
  if (s.intention) q.set('intention', s.intention);
  if (s.category) q.set('category', s.category);

  /* Keep the previous results on screen while refetching; only show
     skeletons on a cold first paint. */
  if (!grid.children.length) {
    grid.innerHTML = AV.skeletonCards(8);
    AV.reveal(grid);
  }
  grid.setAttribute('aria-busy', 'true');

  try {
    const env = await AV.api.get(`/api/products?${q.toString()}`);
    if (token !== loadToken) return;
    const items = env.data || [];
    const total = env.meta?.total ?? items.length;

    countEl.textContent = `${total} ${total === 1 ? 'piece' : 'pieces'}`;
    grid.innerHTML = items.length
      ? items.map((p, i) => AV.productCard(p, i)).join('')
      : `<div class="empty">Nothing matches that search — try a different intention or filter.<br><button class="btn btn-ghost" data-reset-filters>Clear filters</button></div>`;
    AV.markInCart();

    const meta = env.meta || {};
    page = meta.page || page;
    pagerEl.innerHTML = `
      ${page > 1 ? '<button class="btn btn-ghost" data-page="' + (page - 1) + '">← Prev</button>' : ''}
      <span class="meta-count">Page ${meta.page || page} of ${meta.totalPages || 1}</span>
      ${meta.hasMore ? '<button class="btn btn-ghost" data-page="' + (page + 1) + '">Next →</button>' : ''}`;
    pagerEl.querySelectorAll('[data-page]').forEach((b) =>
      b.addEventListener('click', () => {
        page = Number(b.dataset.page);
        syncUrl();
        load();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
    );

    loadFeatured();
  } catch (e) {
    if (token !== loadToken) return;
    /* Distinguish "the shop is down" from "no matches", so the visitor knows
       whether to wait or to change their filters. */
    grid.innerHTML = `<div class="empty">The collection could not be loaded just now.<br>
      <span class="muted">${AV.esc(AV.firstErr(e))}</span><br>
      <button class="btn btn-ghost" data-retry>Try again</button></div>`;
    countEl.textContent = '';
    pagerEl.innerHTML = '';
    AV.qs('#featuredRail').hidden = true;
  } finally {
    if (token === loadToken) grid.removeAttribute('aria-busy');
  }
}



/* Reloads in place. A full navigation would throw away the page, reset scroll
   and replay the boot sequence on every chip or dropdown change. */
function refetch({ resetPage = true, scroll = false } = {}) {
  if (resetPage) page = 1;
  syncUrl();
  load();
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}

grid.addEventListener('click', (e) => {
  const reset = e.target.closest('[data-reset-filters]');
  if (reset) {
    for (const k of ['search', 'intention', 'category']) params.delete(k);
    AV.qs('#searchInput').value = '';
    AV.qs('#catSelect').value = '';
    AV.qsa('#intentionChips .chip').forEach((c) => c.classList.remove('on'));
    refetch();
    return;
  }
  if (e.target.closest('[data-retry]')) {
    AV.qs('#featuredRail').hidden = true;
    load();
  }
});

async function initFilters() {
  const s = state();
  AV.qs('#searchInput').value = s.search || '';
  /* Reflect the URL in the control; fall back to Newest for anything the
     select does not offer so it can never display a stale, mismatched value. */
  const sortEl = AV.qs('#sortSelect');
  const wanted = `${s.sort}:${s.order}`;
  sortEl.value = [...sortEl.options].some((o) => o.value === wanted)
    ? wanted
    : ([...sortEl.options].some((o) => o.value === s.sort) ? s.sort : 'createdAt:desc');

  try {
    const env = await AV.api.get('/api/products/intentions');
    const intentions = Array.isArray(env.data) ? env.data : (env.data || []);
    const chips = AV.qs('#intentionChips');
    [['', 'All']].concat(intentions.map((x) => [x.name || x, x.name || x])).forEach(([val, label]) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (s.intention && s.intention.toLowerCase() === String(val).toLowerCase() ? ' on' : '');
      chip.textContent = label;
      chip.dataset.intention = val;
      chip.addEventListener('click', () => {
        const same = s.intention.toLowerCase() === String(val).toLowerCase();
        params.delete('category');
        params.delete('search');
        if (!same) params.set('intention', val);
        else params.delete('intention');
        AV.qs('#searchInput').value = '';
        AV.qs('#catSelect').value = '';
        AV.qsa('#intentionChips .chip').forEach((c) => {
          c.classList.toggle('on', !same && c.dataset.intention === val);
        });
        refetch();
      });
      chips.appendChild(chip);
    });
  } catch (_e) { /* filters are optional */ }

  try {
    const all = await AV.api.get('/api/products?limit=50');
    const cats = [...new Set((all.data || []).map((p) => p.category).filter(Boolean))];
    const sel = AV.qs('#catSelect');
    cats.forEach((c) => {
      const o = document.createElement('option');
      o.value = c;
      o.textContent = c[0].toUpperCase() + c.slice(1);
      sel.appendChild(o);
    });
    sel.value = s.category || '';
  } catch (_e) { /* optional */ }
}

AV.qs('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = AV.qs('#searchInput').value.trim();
  if (v) params.set('search', v);
  else params.delete('search');
  refetch();
});

AV.qs('#catSelect').addEventListener('change', (e) => {
  if (e.target.value) params.set('category', e.target.value);
  else params.delete('category');
  AV.qsa('#intentionChips .chip').forEach((c) => c.classList.remove('on'));
  refetch();
});

AV.qs('#sortSelect').addEventListener('change', (e) => {
  /* Option values carry an explicit direction ("price:asc") so the select and
     the URL cannot disagree about which way "price" is being sorted. */
  const [sort, order = 'asc'] = e.target.value.split(':');
  params.set('sort', sort);
  params.set('order', order);
  refetch();
});

initFilters();
load();

/* The header search icon deep-links here as ?focus=1 — honour it by putting
   the caret in the field and bringing it into view. */
if (new URLSearchParams(location.search).get('focus') === '1') {
  const input = AV.qs('#searchInput');
  requestAnimationFrame(() => {
    input.focus({ preventScroll: true });
    input.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}
</script>
</body>
</html>
