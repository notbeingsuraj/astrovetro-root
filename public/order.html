<body data-av-auth="required">
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<header class="page-hero">
  <div class="wrap">
    <a class="back" href="/orders.html">← All orders</a>
    <div class="eyebrow">Your order</div>
    <h1 id="orderTitle">Thank you.</h1>
    <p class="sub" id="orderSub">We are getting your order ready.</p>
  </div>
</header>

<main id="main">
  <div class="page">
    <div class="wrap" id="orderPane" style="max-width:900px">
      <div class="av-skeleton" aria-hidden="true">
        <div class="line-lg"></div><div class="line-xl"></div>
      </div>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="/assets/api.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/customer.js"></script>
<script>
/* ====================================================================
   ORDER DETAIL — /orders/:orderId

   One order, from GET /api/orders/:orderId. The identifier comes from the
   path, so a refresh, a bookmark or a pasted link behaves like a click.

   Ownership is the server's decision. It answers 404 for an order that is not
   this customer's — the same answer as for one that does not exist, so the URL
   cannot be used to discover other people's order numbers. The page shows that
   one message and does not try to distinguish the two cases.

   Money shown is the order's own snapshot, not today's catalogue prices: an
   order is a record of what was agreed, and re-reading the catalogue would let
   a later price change rewrite history. That is why `unitPrice` and `lineTotal`
   come from the order document rather than being recomputed from the products.
   ==================================================================== */

const C = AV.customer;
const pane = AV.qs('#orderPane');

/* From the path, not the query string: this page has one canonical URL. The
   `?number=` spelling still works server-side and is redirected, so old links
   and bookmarks land here. */
const ref = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
/* `placed=1` is set by checkout on the redirect after an order is placed. It
   changes the wording of the confirmation, nothing else. */
const justPlaced = C.readParam('placed') === '1';

/* How the customer reads the payment method. The stored value is a machine
   enum, and "cod" / "card" / "upi" were shown raw while the admin desk spelled
   the same values out. Display wording only — the stored enum is what an order
   is matched on, so it is never altered. */
const PAYMENT_LABEL = {
  cod: 'Cash on delivery',
  card: 'Card',
  upi: 'UPI',
  netbanking: 'Net banking',
  wallet: 'Wallet',
};

C.start('#orderPane', async (root) => {
  if (await C.needsDatabase()) return C.databaseUnavailable(pane);

  const user = await AV.me();
  if (!user) {
    return C.gate(pane, {
      reason: 'An order belongs to the account that placed it.',
      actions: [{ href: '/orders.html', label: 'Your orders' }],
    });
  }
  AV.setUser(user);

  await load();
});

async function load() {
  C.loading(pane, 'Loading your order');
  try {
    const order = await AV.orders.get(ref);
    render(order);
  } catch (err) {
    C.clearBusy(pane);
    /* 404 here means either "no such order" or "not yours". Both render the
       same way on purpose: distinguishing them would confirm which order
       numbers exist. A 404 therefore gets no retry — trying again cannot make
       an order appear. Everything else (500s, a dropped connection, a timeout)
       is worth another attempt, and load() is safe to repeat. */
    const missing = err && (err.status === 404 || err.status === 400);
    C.error(pane, err, {
      level: 'h2',
      title: 'We could not find that order',
      retry: missing ? null : load,
    });
    /* Placed after whichever heading C.error rendered. Looking for a fixed 'h3'
       silently did nothing on this page, which asked for level:'h2' — so the
       note and its only route out of the dead end were dropped. */
    const el = AV.qs('.av-state', pane);
    if (el) {
      const p = document.createElement('p');
      p.innerHTML = 'It may belong to another account, or the reference may be wrong. <a href="/orders.html">See all your orders</a>.';
      (el.querySelector('h1, h2, h3, h4') || el).after(p);
    }
    AV.qs('#orderTitle').textContent = 'Order not found.';
    AV.qs('#orderSub').textContent = 'We could not match that reference to an order on your account.';
  }
}

function render(o) {
  C.clearBusy(pane);

  const itemCount = (o.items || []).reduce((n, i) => n + i.quantity, 0);
  const paid = o.paymentStatus === 'paid';

  /* The heading states what actually happened to the order, in the customer's
     terms. A pending order that was just placed is not the same as one placed
     three weeks ago, and the copy reflects that difference rather than showing
     a status label on its own. */
  AV.qs('#orderTitle').textContent = justPlaced
    ? paid ? 'Order confirmed and paid.' : 'Order confirmed.'
    : `Order ${o.orderNumber}.`;
  AV.qs('#orderSub').textContent = subtitle(o, paid);

  /* Every totals row the server sent is listed, including tax. Tax is currently
     zero and was therefore left out, which meant the visible rows summed to the
     total only by coincidence — the first non-zero tax rate would have shown a
     set of figures that did not add up, with nothing to indicate a line was
     missing. The subtotal, the discount, the tax and the total are all server
     values; only the sign of the discount is a display convention. */
  pane.innerHTML = `
    ${justPlaced ? confirmationNote(paid) : ''}
    <div class="order-card" style="margin-bottom:24px">
      <div class="order-card-head">
        <div>
          <div class="num">${AV.esc(o.orderNumber)}</div>
          <div class="meta">
            <span>Placed ${AV.formatDate(o.createdAt)}</span>
            <span>${AV.esc(C.pieces(itemCount))}</span>
            ${paid && o.paidAt ? `<span>Paid ${AV.formatDate(o.paidAt)}</span>` : ''}
          </div>
        </div>
        <div style="display:grid;gap:6px;justify-items:end">
          ${C.statusBadge(o.status)}
          <span class="meta" style="color:var(--text-muted)">${AV.esc(PAYMENT_LABEL[o.paymentMethod] || o.paymentMethod || '')}${o.paymentStatus && o.paymentStatus !== 'pending' ? ` · ${AV.esc(o.paymentStatus)}` : ''}</span>
        </div>
      </div>
      <div class="order-card-actions">
        ${o.hasTracking
          ? `<a class="btn btn-light btn-sm" href="/tracking/${encodeURIComponent(o.orderNumber)}">Track this parcel</a>`
          : `<a class="btn btn-outline btn-sm" href="/shop.html">Continue shopping</a>`}
        <a class="btn btn-outline btn-sm" href="/orders.html">All orders</a>
      </div>
    </div>

    <h2 style="font:400 var(--text-h2) var(--font-display);margin-bottom:14px">What you ordered</h2>
    <div class="order-lines">${(o.items || []).map(C.orderLine).join('\n')}</div>

    ${C.totals([
      { label: 'Subtotal', value: o.subtotal },
      { label: 'Shipping', value: o.shipping, free: Number(o.shipping) === 0 },
      Number(o.discount) ? { label: 'Discount', value: -Math.abs(o.discount) } : null,
      Number(o.tax) ? { label: 'Tax', value: o.tax } : null,
    ].filter(Boolean), { total: o.total, totalLabel: `Total (${AV.esc(o.currency || 'INR')})` })}

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:36px">
      ${addressBlock('Delivering to', o.shippingAddress)}
      ${contactBlock(o)}
    </div>

    <p class="note" style="margin-top:32px">
      Prices on this page are the ones agreed when the order was placed. If you
      edit your account details later, this order keeps the address it was
      shipped to.
    </p>`;
}

function subtitle(o, paid) {
  if (justPlaced) {
    return paid
      ? 'A receipt is on its way to your inbox, and you will hear from us again when it ships.'
      : 'Nothing has been charged. We will contact you to arrange payment on delivery.';
  }
  if (o.hasTracking) return 'This parcel is on its way and can be tracked.';
  if (o.status === 'cancelled') return 'This order was cancelled. Nothing further is due.';
  return 'We will email you as soon as it is on its way.';
}

/* Shown once, after checkout redirects here. Says what to expect next rather
   than repeating the totals directly above it. */
function confirmationNote(paid) {
  return `
    <div class="notice" role="status">
      ${paid
        ? 'Thank you. Your payment has been received and your order is confirmed.'
        : 'Thank you. Your order is confirmed — nothing has been charged yet.'}
      ${paid
        ? ' We will email a receipt to your account address.'
        : ' Please keep the amount ready for the courier.'}
    </div>`;
}

function addressBlock(title, a) {
  return `
    <div>
      <h3 style="font:400 22px var(--font-display);margin-bottom:8px">${AV.esc(title)}</h3>
      <address style="font-style:normal;color:var(--text-secondary);font-size:13px;line-height:1.8">
        <b style="color:var(--text-primary)">${AV.esc(a?.name || '')}</b><br>
        ${C.addressText(a)}
        ${a?.phone ? `<br>${AV.esc(a.phone)}` : ''}
      </address>
    </div>`;
}

function contactBlock(o) {
  return `
    <div>
      <h3 style="font:400 22px var(--font-display);margin-bottom:8px">Contact</h3>
      <div style="color:var(--text-secondary);font-size:13px;line-height:1.8">
        ${AV.esc(o.customerEmail || '')}
      </div>
    </div>`;
}
</script>
</body>
</html>
