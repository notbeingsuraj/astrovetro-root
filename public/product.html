<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17221d">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/favicon.svg">
<meta name="robots" content="noindex, follow">
<meta name="description" content="Stone, setting, dimensions and what this piece is for.">
<title>Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="canonical" href="/product.html">
<meta property="og:site_name" content="Astro Vetro">
<meta property="og:type" content="website">
<meta property="og:title" content="Product — Astro Vetro">
<meta property="og:description" content="Stone, setting, dimensions and what this piece is for.">
<meta property="og:url" content="/product.html">
<meta property="og:image" content="/assets/img/og-card.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Product — Astro Vetro">
<meta name="twitter:description" content="Stone, setting, dimensions and what this piece is for.">
<meta name="twitter:image" content="/assets/img/og-card.svg">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<main id="main">
  <div class="page">
    <div class="wrap pd" id="productMain">
      <div class="pd-art js-load" id="pdArt"></div>
      <div class="pd-info js-load" id="pdInfo"></div>
    </div>
  </div>
  <section class="section products">
    <div class="wrap">
      <div class="section-title">
        <div><div class="eyebrow">Continuing the collection</div><h2>You may also want</h2></div>
      </div>
      <div class="products-grid" id="relatedGrid"></div>
    </div>
  </section>
</main>

<footer id="siteFooter"></footer>

<script src="/assets/api.js"></script>
<script src="/assets/store.js"></script>
<script>
AV.boot();
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const pdArt = AV.qs('#pdArt');
const pdInfo = AV.qs('#pdInfo');

async function load() {
  pdArt.innerHTML = '<div class="empty">Loading…</div>';
  pdInfo.innerHTML = '';
  try {
    const env = await AV.api.get(`/api/products/${encodeURIComponent(slug)}`);
    const p = env.data;
    if (!p) throw new Error('Product not found');
    AV.seo({
      title: p.name,
      description: p.description ||
        `${p.name}${p.stone ? ' in ' + p.stone : ''} — ${p.category || 'crystal'}.`,
      url: `/product.html?slug=${encodeURIComponent(p.slug)}`,
      type: 'product',
    });

    pdArt.innerHTML = `<div class="art ${AV.art(Math.abs(hash(p.slug)) % 8)}" role="img" aria-label="${AV.esc(p.name)}" style="height:100%"></div>`;
    pdInfo.innerHTML = `
      <div class="pd-cat">${AV.esc(p.category || '')}${p.stone ? ' · ' + AV.esc(p.stone) : ''}${p.metal ? ' · ' + AV.esc(p.metal) : ''}</div>
      <h1>${AV.esc(p.name)}</h1>
      <div class="rating">${'★'.repeat(Math.round(p.rating || 5))}<b> ${(p.rating || 0).toFixed(1)}</b> · ${p.reviewCount || 0} reviews</div>
      <div class="pd-price">${AV.formatPrice(p.price)}</div>
      <p class="pd-desc">${AV.esc(p.description || '')}</p>
      <div class="intention-chips" id="intChips"></div>
      <div class="pd-meta" id="shortInfo"></div>
      <div class="qty-row">
        <div class="stepper">
          <button type="button" id="minus">−</button>
          <span id="qty">1</span>
          <button type="button" id="plus">+</button>
        </div>
        <span class="stock${p.availability ? '' : ' sold'}" id="avail">${p.availability ? 'In stock — ships in 2–3 days' : 'Currently unavailable'}</span>
      </div>
      <div class="pd-buy">
        <button class="btn btn-light" id="addBtn" ${p.availability ? '' : 'disabled'}>Add to bag</button>
        <button class="icon icon-save" id="saveBtn" data-save="${AV.esc(p.id ?? p._id ?? '')}"
          aria-pressed="false" aria-label="Save ${AV.esc(p.name)} to wishlist" title="Save to wishlist">\u2661</button>
      </div>
      <p class="note" style="margin-top:22px">Hand-selected pieces, packed by hand and shipped in small batches from Astro Vetro.</p>`;

    const chips = (p.intentions || []).map((x) => `<span class="tag">${AV.esc(x)}</span>`).join('');
    AV.qs('#intChips').innerHTML = chips;
    AV.qs('#shortInfo').innerHTML = `
      ${p.shortDescription ? `<div><b>In brief</b> ${AV.esc(p.shortDescription)}</div>` : ''}`;

    const plus = AV.qs('#plus'), minus = AV.qs('#minus'), qtyEl = AV.qs('#qty');
    let qty = 1;
    plus.addEventListener('click', () => { qty = Math.min(99, qty + 1); qtyEl.textContent = qty; });
    minus.addEventListener('click', () => { qty = Math.max(1, qty - 1); qtyEl.textContent = qty; });
    /* Saved state is read from the shared cache the header already filled, so the
       heart shows the truth on load without a request of its own. */
    AV.markSaved();

    /* No listener of its own on #saveBtn. It carries data-save, so the shared
       delegated handler in store.js already owns it — adding a second handler
       here made one click toggle the piece twice and land back where it
       started. */

    /* AV.bag decides between the guest bag and the server bag, so this button
       behaves correctly whether or not the visitor has an account. `await` and
       the busy guard matter here: a double click must not add twice, and the
       toast only appears once the server has confirmed the add. */
    const addBtn = AV.qs('#addBtn');
    addBtn.addEventListener('click', async () => {
      if (addBtn.dataset.avBusy === '1') return;
      addBtn.dataset.avBusy = '1';
      AV.setBusy(addBtn, true);
      try {
        const ok = await AV.bag.add(
          { id: p.id ?? p._id ?? null, slug: p.slug, name: p.name, price: p.price, image: p.images?.[0] || null, stock: p.stock },
          qty
        );
        if (ok) AV.toast(`Added ${qty} × \u201c${p.name}\u201d to your bag.`, 'ok');
      } finally {
        delete addBtn.dataset.avBusy;
        AV.setBusy(addBtn, false);
      }
    });


    try {
      const rel = await AV.api.get('/api/products?limit=12&sort=rating&order=desc');
      const pool = (rel.data || []).filter((x) => x.slug !== p.slug);
      pool.sort((a, b) => (b.intentions || []).filter((x) => (p.intentions || []).includes(x)).length - (a.intentions || []).filter((x) => (p.intentions || []).includes(x)).length);
      AV.qs('#relatedGrid').innerHTML = pool.slice(0, 4).map((x, i) => AV.productCard(x, i)).join('')
        || '<div class="empty">More pieces arriving soon.</div>';
    } catch (_e) {
      AV.qs('#relatedGrid').innerHTML = '<div class="empty">More pieces arriving soon.</div>';
    }
  } catch (e) {
    pdArt.innerHTML = '';
    pdInfo.innerHTML = `<h1 style="font-size:clamp(32px,4vw,52px);text-transform:uppercase;margin-bottom:14px">Piece unavailable</h1>`
      + `<div class="empty" style="text-align:left">${AV.esc(AV.firstErr(e))}<br><a class="btn btn-ghost" href="/shop.html">Back to shop</a></div>`;
  }
}

function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

load();
</script>
</body>
</html>
