<!-- The gateway. This document is the whole entry experience: the brand and
     two panels, locked to the viewport. There is no header, no footer, no
     page content and no stored state — the homepage lives at /home.html and
     the two destinations are /crystals.html and /readings.html.

     The scroll lock lives in gateway.css, which only this page loads. -->
<body>

<div class="gateway">

  <h1 class="gateway-brand"><a href="/home.html">Astrovetro</a></h1>

  <section class="hero-split" id="hero" data-clip="intentional" aria-label="Choose an experience">
    <div class="hero-track">

      <a class="hero-panel hero-panel--crystals" href="/crystals.html" data-panel="crystals">
        <span class="hero-bg" aria-hidden="true"></span>
        <span class="hero-veil" aria-hidden="true"></span>
        <span class="hero-name">Crystals</span>
      </a>

      <a class="hero-panel hero-panel--rituals" href="/readings.html" data-panel="rituals">
        <span class="hero-bg" aria-hidden="true"></span>
        <span class="hero-veil" aria-hidden="true"></span>
        <span class="hero-name">Rituals</span>
      </a>

    </div>
  </section>

</div>

<script>
(function () {
  /* A link fires on Enter but not on Space - Space scrolls. These two panels
     are meant to be operated like buttons, so they get the missing key.
     preventDefault on keydown is what keeps the locked page from budging. */
  var hero = document.getElementById('hero');
  if (!hero) return;
  hero.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Spacebar') return;
    var panel = e.target.closest('[data-panel]');
    if (!panel) return;
    e.preventDefault();
    panel.click();
  });
})();
</script>
</body>
