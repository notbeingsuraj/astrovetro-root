<style>
/* Admin-only layout. Scoped here, not in app.css, so the storefront styles a
   customer downloads are untouched by anything this internal page needs. All
   colours reuse the site's own variables; nothing invents a palette.
   The application logic lives in /assets/admin.js. */

/* ── Toolbar ──────────────────────────────────────────────────── */
.adm-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.adm-toolbar input,
.adm-toolbar select { width: auto; min-width: 150px; }
.adm-toolbar .spacer { flex: 1 1 40px; }
.adm-check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--sage);
  text-transform: none;
  letter-spacing: 0;
}
.adm-check input { width: auto; }
/* A <label> that looks like a button and holds a hidden file input. */
.adm-filebtn { cursor: pointer; }

/* ── Tables ───────────────────────────────────────────────────── */
.adm-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  white-space: nowrap;
}
.adm-cell { display: flex; gap: 10px; align-items: center; }
.adm-thumb {
  width: 44px;
  height: 44px;
  flex: none;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid var(--line);
  display: block;
  background: rgba(16, 38, 31, 0.5);
}
.adm-thumb-blank { background: linear-gradient(135deg, #1e362b, #12241c); }
.adm-pager {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.adm-pager .muted { font-size: 12px; }

/* ── Pills ────────────────────────────────────────────────────── */
.pill {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--line);
  color: var(--sage);
}
.pill-ok { color: #9ec49a; border-color: rgba(158, 196, 154, 0.45); }
.pill-warn { color: #e0b46a; border-color: rgba(224, 180, 106, 0.45); }
.pill-bad { color: #e08f8f; border-color: rgba(224, 143, 143, 0.45); }
.pill-muted { opacity: 0.75; }

/* ── Two-column sections (dashboard, settings) ────────────────── */
.adm-two {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px 34px;
  margin-bottom: 30px;
}
.adm-two h3 { margin-bottom: 10px; }

/* ── Dialog forms ─────────────────────────────────────────────── */
.adm-dlg-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.adm-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px 16px;
}
.adm-form label {
  display: grid;
  gap: 6px;
  align-content: start;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--sage);
}
.adm-form .wide { grid-column: 1 / -1; }
.adm-form input,
.adm-form select,
.adm-form textarea { width: 100%; }
.adm-form .btn,
.adm-form .form-msg { grid-column: 1 / -1; }
.adm-hint { color: var(--text-muted); text-transform: none; letter-spacing: 0; }
.adm-preview { font-size: 13px; color: var(--sage); margin: 0; }
.adm-preview.is-bad { color: #e08f8f; }
.adm-note { font-size: 12px; color: var(--sage); }

/* ── Product images dialog ────────────────────────────────────── */
.adm-imglist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.adm-imglist li {
  display: flex;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  background: rgba(16, 38, 31, 0.35);
}
.adm-imglist img {
  width: 64px;
  height: 64px;
  flex: none;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}
.adm-imgmeta { flex: 1; display: grid; gap: 8px; }
.adm-imgmeta input { width: 100%; }

/* ── Purchase-order line editor ───────────────────────────────── */
.adm-linelabel {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--sage);
  margin-bottom: 8px;
}
.adm-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 90px 120px auto;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}

/* ── Image library grid ───────────────────────────────────────── */
.adm-lib-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.adm-lib-card {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: rgba(16, 38, 31, 0.35);
  display: flex;
  flex-direction: column;
}
.adm-lib-card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}
.adm-lib-card .meta {
  padding: 8px 10px;
  font-size: 10px;
  color: var(--sage);
  word-break: break-all;
  flex: 1;
}
.adm-lib-card .acts {
  display: flex;
  gap: 6px;
  padding: 0 10px 10px;
  flex-wrap: wrap;
}
.adm-assigned { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

/* ── Reports ──────────────────────────────────────────────────── */
.adm-reports {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}
.adm-report {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  background: rgba(16, 38, 31, 0.3);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-start;
}
.adm-report h3 { margin: 0; }
.adm-report .note { margin: 0; }
.adm-reportrow { display: flex; gap: 10px; flex-wrap: wrap; }
.adm-reportfield {
  display: grid;
  gap: 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--sage);
}
.adm-reportfield input,
.adm-reportfield select { min-width: 130px; }

@media (max-width: 720px) {
  .adm-toolbar input,
  .adm-toolbar select { width: 100%; }
  .adm-line { grid-template-columns: minmax(0, 1fr); }
  .adm-thumb { width: 36px; height: 36px; }
}
</style>
